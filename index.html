<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halvorsen Teknologi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030508;
            --accent-cyan: #00f0ff;
            --accent-purple: #bd00ff;
            --accent-pink: #ff007f;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* --- INTRO BOOT SEQUENCE --- */
        #boot-overlay {
            position: fixed;
            inset: 0;
            background-color: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s cubic-bezier(0.8, 0, 0.2, 1);
        }

        #boot-laser {
            width: 0%;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 20px var(--accent-cyan), 0 0 40px var(--accent-cyan);
            transition: width 0.8s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .boot-flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 99;
            transition: opacity 0.8s ease-out;
        }

        /* --- CANVAS --- */
        #network-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- UI ELEMENTS --- */
        #ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let mouse interact with canvas behind */
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            pointer-events: auto; /* Make cards interactable if needed */
        }

        /* Subtitle Badge */
        .tech-badge {
            display: inline-block;
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.1), rgba(189, 0, 255, 0.1));
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 0.5rem 1.5rem;
            border-radius: 100px;
            letter-spacing: 0.3em;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 1rem;
        }

        /* Main Typography */
        .title {
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
        }

        /* Floating Dashboard Elements */
        .dash-element {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #808090;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dash-element.active {
            opacity: 1;
            transform: translateY(0);
        }

        .dash-top-left { top: 2rem; left: 2rem; }
        .dash-bottom-right { bottom: 2rem; right: 2rem; text-align: right; }

        /* Animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        .delay-1 { transition-delay: 0.8s; }
        .delay-2 { transition-delay: 1.1s; }
        .delay-3 { transition-delay: 1.4s; }

        .blink { animation: blinker 2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <!-- BOOT SEQUENCE OVERLAY -->
    <div id="boot-overlay">
        <div id="boot-laser"></div>
    </div>
    <div id="flash-overlay" class="boot-flash"></div>

    <!-- INTERACTIVE BACKGROUND -->
    <canvas id="network-canvas"></canvas>

    <!-- FLOATING DASHBOARD CARDS (HUD) -->
    <div class="dash-element dash-top-left glass-card p-4 delay-3">
        <div class="flex items-center gap-2 mb-2">
            <div class="w-2 h-2 rounded-full bg-[#00f0ff] blink" style="box-shadow: 0 0 8px #00f0ff;"></div>
            <span class="text-white font-bold tracking-widest">HT-CORE_v2.0</span>
        </div>
        <div class="text-[0.65rem] tracking-wider text-gray-400">
            > INITIALIZING NEURAL MESH<br>
            > RUNTIME: STABLE<br>
            > LATENCY: 12ms
        </div>
    </div>

    <div class="dash-element dash-bottom-right glass-card p-4 delay-3">
        <div class="text-[#bd00ff] font-bold mb-1">SYSTEM ARCHITECTURE</div>
        <div class="text-[0.65rem] tracking-wider text-gray-400">
            [NODE CLUSTER: ACTIVE]<br>
            AWAITING INPUT...
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main id="ui-layer">
        <div class="text-center">
            <h1 class="title reveal delay-1">Halvorsen Teknologi</h1>
            <div class="reveal delay-2">
                <div class="tech-badge">Utviklingsstudio</div>
            </div>
            <p class="mt-4 text-gray-400 max-w-md mx-auto reveal delay-2 text-sm leading-relaxed" style="font-family: 'JetBrains Mono', monospace;">
                // Engineering scalable digital ecosystems.
            </p>
        </div>
    </main>

    <script>
        // --- BOOT SEQUENCE LOGIC ---
        window.addEventListener('load', () => {
            const bootOverlay = document.getElementById('boot-overlay');
            const bootLaser = document.getElementById('boot-laser');
            const flash = document.getElementById('flash-overlay');
            const reveals = document.querySelectorAll('.reveal, .dash-element');

            // 1. Expand laser
            setTimeout(() => {
                bootLaser.style.width = '100%';
            }, 300);

            // 2. Flash screen & hide boot overlay
            setTimeout(() => {
                flash.style.opacity = '0.8';
                bootOverlay.style.opacity = '0';
                
                // Initialize canvas network exactly at flash point
                initNetwork();
            }, 1100);

            // 3. Fade out flash & reveal text
            setTimeout(() => {
                flash.style.opacity = '0';
                bootOverlay.style.display = 'none';
                
                reveals.forEach(el => el.classList.add('active'));
            }, 1300);
        });


        // --- HIGHLY INTERACTIVE NEURAL NETWORK CANVAS ---
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        
        // Colors: Cyan, Purple, Pink, Electric Blue
        const colors = ['#00f0ff', '#bd00ff', '#ff007f', '#0055ff'];

        const mouse = {
            x: null,
            y: null,
            radius: 150 // Radius of mouse interaction
        };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // Clear mouse interaction when it leaves screen
        window.addEventListener('mouseout', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initNetwork(); // Re-initialize on resize for good distribution
        }
        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.baseRadius = Math.random() * 2 + 1;
                this.radius = this.baseRadius;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.density = (Math.random() * 30) + 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset for lines
            }

            update() {
                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx = -this.vx;
                if (this.y < 0 || this.y > height) this.vy = -this.vy;

                // Move
                this.x += this.vx;
                this.y += this.vy;

                // Mouse Interaction Logic (Dodging/Repelling)
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        // Push away
                        this.x -= directionX * 0.5;
                        this.y -= directionY * 0.5;
                        this.radius = this.baseRadius * 2; // Glow up when close
                    } else {
                        if (this.radius > this.baseRadius) {
                            this.radius -= 0.1;
                        }
                    }
                }
            }
        }

        function initNetwork() {
            particles = [];
            // Amount of particles relative to screen size
            let numberOfParticles = (width * height) / 9000;
            // Cap it so it doesn't melt the browser
            if(numberOfParticles > 200) numberOfParticles = 200; 

            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);

            // Connect particles
            for (let a = 0; a < particles.length; a++) {
                particles[a].update();
                particles[a].draw();

                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = particles[a].color;
                        ctx.globalAlpha = 1 - (distance / 120);
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }

                // Connect to mouse cursor
                if (mouse.x != null && mouse.y != null) {
                    let dxMouse = particles[a].x - mouse.x;
                    let dyMouse = particles[a].y - mouse.y;
                    let distanceMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

                    if (distanceMouse < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = particles[a].color; // Uses the particle's vibrant color
                        ctx.globalAlpha = 1 - (distanceMouse / 150);
                        ctx.lineWidth = 1.5;
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }
        }

        // Set dimensions but don't start drawing until flash
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        animate();

    </script>
</body>
</html>
